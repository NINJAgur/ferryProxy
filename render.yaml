services:
  - type: web
    name: ferry-relay
    runtime: python
    plan: free
    # Closest region to Israel; oregon/ohio/virginia/singapore are the alternatives.
    region: frankfurt
    # The repo holds the app too, and only the relay is deployed.
    rootDir: server
    buildCommand: pip install -r requirements.txt
    # Render assigns the port; binding anything else makes the service unreachable.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Never true in production: it would let anyone unlock the paid models.
      - key: ALLOW_DEV_SUBSCRIPTION
        value: "false"
      - key: PURCHASE_ANSWER_ALLOWANCE
        value: "500"
      # Everything the relay writes belongs on the mounted disk. The defaults sit
      # under the app directory, which is read-only in the container — the writes
      # then fail quietly, and a restore code that was never written is a web
      # purchase nobody can move to a new device.
      - key: ENTITLEMENT_STORE_PATH
        value: /var/data/entitlements.json
      - key: RESTORE_CODE_STORE_PATH
        value: /var/data/restore-codes.json
      - key: CHUNK_CACHE_PATH
        value: /var/data/chunks
      - key: USAGE_LOG_PATH
        value: /var/data/usage.jsonl
      # The web checkout announces a purchase once, over a webhook. Nothing can
      # be asked again, so losing this file loses the purchase.
      - key: WEB_PURCHASE_STORE_PATH
        value: /var/data/web-purchases.json
      # sync:false keeps secrets out of the repo — Render prompts for these once.
      - key: GEMINI_FREE_API_KEY
        sync: false
      - key: GEMINI_PAID_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REVENUECAT_API_KEY
        sync: false
      # Without it the webhook endpoint refuses everything, which is the safe
      # direction: an unverifiable purchase would unlock the paid models.
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
